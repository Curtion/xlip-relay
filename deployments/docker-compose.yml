services:
  xlip-relay:
    image: curtion/xlip-relay:latest
    container_name: xlip-relay
    restart: unless-stopped
    ports:
      - '19090:19090'
    volumes:
      - ./config.toml:/etc/xlip-relay/config.toml:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '19090']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
