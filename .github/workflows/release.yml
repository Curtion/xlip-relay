name: Release

# 推送 v* tag 时触发：构建多平台二进制发布到 GitHub Release + 推送多架构 Docker 镜像到 Docker Hub
on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release 创建 Release 需要 contents: write
permissions:
  contents: write

jobs:
  # Job A：Go 原生交叉编译 8 个目标平台二进制
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: '386'
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # v1.2.3 -> 1.2.3
          VERSION="${GITHUB_REF_NAME#v}"
          # windows 产物带 .exe 后缀
          if [ "${GOOS}" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          # 静态编译，参数与 build/Dockerfile 保持一致
          go build -trimpath -ldflags="-s -w" -o "relay${EXT}" .
          # 打包：非 windows 用 tar.gz，windows 用 zip
          ARCHIVE="relay_${VERSION}_${GOOS}_${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            zip "${ARCHIVE}.zip" "relay${EXT}" config.toml
          else
            tar -czf "${ARCHIVE}.tar.gz" "relay${EXT}" config.toml
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: relay_*.*
          if-no-files-found: error
          retention-days: 7

  # Job B：多架构 Docker 镜像构建并推送到 Docker Hub（与 A 并行）
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 根据 semver tag 自动生成镜像标签：v1.2.3 -> 1.2.3, 1.2, latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: curtion/xlip-relay
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Job C：创建 GitHub Release 并上传二进制产物（依赖 A）
  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          # 所有压缩包生成 sha256 校验文件
          sha256sum relay_*.tar.gz relay_*.zip > checksums.txt
          echo "## 校验文件" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat checksums.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/relay_*.tar.gz
            dist/relay_*.zip
            dist/checksums.txt
